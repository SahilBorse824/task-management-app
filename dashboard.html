<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="brand">
        <span>✓</span>
        TaskFlow
    </div>

    <div class="user-area">

        <span id="userName">User</span>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </div>

</header>


<main class="dashboard">

    <!-- Welcome -->

    <section class="welcome">

        <div>

            <h1>
                Welcome, <span id="welcomeName">User</span> 👋
            </h1>

            <p>
                Organize your work and stay productive.
            </p>

        </div>

        <button
            id="addTaskBtn"
            class="primary-btn add-btn"
        >
            + Add Task
        </button>

    </section>


    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon blue">
                📋
            </div>

            <div>

                <h3 id="totalTasks">0</h3>

                <p>Total Tasks</p>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon orange">
                ⏳
            </div>

            <div>

                <h3 id="pendingTasks">0</h3>

                <p>Pending</p>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon green">
                ✓
            </div>

            <div>

                <h3 id="completedTasks">0</h3>

                <p>Completed</p>

            </div>

        </div>

    </section>


    <!-- Tasks -->

    <section class="tasks-section">

        <div class="section-header">

            <div>

                <h2>My Tasks</h2>

                <p>
                    Create and manage your tasks.
                </p>

            </div>


            <select id="filterTasks">

                <option value="All">
                    All Tasks
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

        </div>


        <div id="taskList" class="task-list">

            <div class="empty-state">

                <div>📋</div>

                <h3>No tasks yet</h3>

                <p>
                    Click "Add Task" to create your first task.
                </p>

            </div>

        </div>

    </section>

</main>


<!-- Add/Edit Task Modal -->

<div id="taskModal" class="modal">

    <div class="modal-card">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add New Task
            </h2>

            <button
                id="closeModal"
                class="close-btn"
            >
                ×
            </button>

        </div>


        <form id="taskForm">

            <input
                type="hidden"
                id="taskId"
            >


            <div class="form-group">

                <label>
                    Task Title
                </label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="taskDescription"
                    rows="4"
                    placeholder="Enter task description"
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Priority
                    </label>

                    <select id="taskPriority">

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium" selected>
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="taskDueDate"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="taskStatus">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <p
                id="taskMessage"
                class="message"
            ></p>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelTask"
                    class="secondary-btn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Task
                </button>

            </div>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
