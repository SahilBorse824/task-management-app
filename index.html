<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                <span>✓</span>
                TaskFlow
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Manage your tasks and stay productive.
            </p>

            <!-- LOGIN -->

            <form id="loginForm">

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p id="loginMessage" class="message"></p>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="switch-text">
                Don't have an account?
                <button id="showRegister" class="link-btn">
                    Create Account
                </button>
            </p>


            <!-- REGISTER -->

            <form id="registerForm" class="hidden">

                <h2>Create Account</h2>

                <div class="form-group">
                    <label>Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    Register
                </button>

                <p id="registerMessage" class="message"></p>

                <p class="switch-text">
                    Already have an account?
                    <button
                        type="button"
                        id="showLogin"
                        class="link-btn"
                    >
                        Login
                    </button>
                </p>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
